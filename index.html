<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kişisel Websitem</title>
    <style>
      * {
        box-sizing: border-box;
      }

      @font-face {
        font-family: "Orbitron";
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url("orbitron-900.ttf") format("truetype");
      }

      body {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100vh;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #ffdf58;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 1rem;
      }

      main img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      footer {
        padding: 0.75rem 1rem 1rem;
        color: #000000;
        font-family: "Orbitron", sans-serif;
        font-size: clamp(1.25rem, 3vw, 2rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        line-height: 1;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="horozo%C4%9Flu.png" alt="Horozoğlu" />
    </main>
    <footer>coming soon.</footer>
  </body>
</html>
